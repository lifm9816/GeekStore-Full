<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mascota GeekStore saliendo de una escotilla y mirando confundida</title>
<desc>Robot que emerge de un portal, gira la cabeza buscando y muestra un signo de interrogación al no encontrar nada</desc>
<defs>
<style>
.rise { animation: riseUp 5s ease-in-out infinite; transform-origin: 340px 300px; }
@keyframes riseUp {
  0%   { transform: translateY(70px); }
  15%  { transform: translateY(0px); }
  75%  { transform: translateY(0px); }
  90%  { transform: translateY(70px); }
  100% { transform: translateY(70px); }
}
.look { animation: lookAround 5s ease-in-out infinite; transform-origin: 340px 245px; }
@keyframes lookAround {
  0%,15%  { transform: rotate(0deg); }
  30%     { transform: rotate(-10deg); }
  45%     { transform: rotate(10deg); }
  58%,75% { transform: rotate(0deg); }
  100%    { transform: rotate(0deg); }
}
.question { animation: qMark 5s ease-in-out infinite; }
@keyframes qMark {
  0%,58%  { opacity: 0; transform: translateY(6px) scale(0.8); }
  66%     { opacity: 1; transform: translateY(0px) scale(1.1); }
  75%     { opacity: 1; transform: translateY(0px) scale(1); }
  85%,100%{ opacity: 0; transform: translateY(6px) scale(0.8); }
}
</style>
<clipPath id="hatchClip"><rect x="0" y="0" width="680" height="300"/></clipPath>
</defs>
<rect x="0" y="0" width="680" height="360" fill="#19222D"/>
<ellipse cx="340" cy="303" rx="72" ry="14" fill="#0B0F14"/>
<ellipse cx="340" cy="300" rx="64" ry="10" fill="#232E3B" stroke="#3A4657" stroke-width="2"/>
<g clip-path="url(#hatchClip)">
<g class="rise">
  <g class="look">
    <ellipse cx="340" cy="245" rx="66" ry="52" fill="#E9ECE3"/>
    <circle cx="340" cy="238" r="20" fill="#84CC16"/>
    <circle cx="340" cy="238" r="9" fill="#0E141A"/>
    <ellipse cx="270" cy="240" rx="18" ry="26" fill="#CBD1C0"/>
    <ellipse cx="410" cy="240" rx="18" ry="26" fill="#CBD1C0"/>
    <rect x="270" y="90" width="140" height="120" rx="46" fill="#F5F7F0"/>
    <rect x="292" y="118" width="96" height="66" rx="22" fill="#0E141A"/>
    <ellipse cx="322" cy="151" rx="14" ry="17" fill="#84CC16"/>
    <ellipse cx="358" cy="151" rx="14" ry="17" fill="#84CC16"/>
    <circle cx="278" cy="128" r="13" fill="#CBD1C0"/>
    <circle cx="402" cy="128" r="13" fill="#CBD1C0"/>
    <rect x="332" y="66" width="16" height="26" rx="8" fill="#CBD1C0"/>
    <circle cx="340" cy="60" r="9" fill="#84CC16"/>
  </g>
</g>
</g>
<text class="question" x="430" y="80" font-size="46" font-weight="700" fill="#84CC16">?</text>
</svg>
